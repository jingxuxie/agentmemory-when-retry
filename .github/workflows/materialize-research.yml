name: Materialize and validate research
on:
  push:
    paths:
      - research.bundle.sha256
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Verify and materialize source bundle
        run: |
          python - <<'PY'
          import hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          parts = sorted(Path('.').glob('research.bundle.part-*'))
          assert parts, 'Missing source bundle'
          blob = b''.join(p.read_bytes() for p in parts)
          expected = Path('research.bundle.sha256').read_text().strip()
          assert hashlib.sha256(blob).hexdigest() == expected, 'Bundle hash mismatch'
          files = json.loads(lzma.decompress(blob))
          assert isinstance(files, dict) and len(files) < 200
          for name, text in files.items():
              p = PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] not in {'.git', '.github'}
              assert isinstance(text, str)
              dst = Path(name)
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_text(text, encoding='utf-8')
          Path('results/local-environment.json').write_bytes(Path('results/environment.json').read_bytes())
          print('Materialized', len(files), 'verified UTF-8 research files')
          PY
      - name: Install scientific dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Run tests and independent reproduction
        run: |
          python -m pytest -q --junitxml=results/ci-junit.xml
          python scripts/run_experiments.py --suite full --output results
          python scripts/run_experiments.py --suite full --output /tmp/recovery-ci
          python scripts/verify_results.py results /tmp/recovery-ci --report results/ci-reproduction.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          reference=json.loads(Path('results/reproduction.json').read_text())
          comparison={name:{'local_sha256':r['sha256'],'runner_sha256':hashlib.sha256((Path('results')/name).read_bytes()).hexdigest()} for name,r in reference.items()}
          for r in comparison.values(): r['byte_identical']=r['local_sha256']==r['runner_sha256']
          Path('results/cross-environment-hashes.json').write_text(json.dumps(comparison,indent=2)+'\n')
          print(json.dumps(comparison,indent=2))
          PY
      - name: Install LaTeX
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended latexmk
      - name: Rebuild figures and manuscript
        run: |
          python scripts/make_figures.py
          python scripts/build_paper.py
      - name: Commit verified normal research files
        run: |
          rm research.bundle.part-* research.bundle.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add proved research draft, synthetic experiments, and verified results'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-research-validation
          path: |
            paper/main.pdf
            results/*.csv
            results/*reproduction.json
            results/cross-environment-hashes.json
            results/ci-junit.xml
